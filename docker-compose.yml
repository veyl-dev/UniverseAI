services:
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama_data:/root/.ollama]
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: universeai
      POSTGRES_USER: universeai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U universeai -d universeai"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-qwen2.5:3b}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://universeai:${POSTGRES_PASSWORD:-change-this-password}@db:5432/universeai}
      JWT_SECRET: ${JWT_SECRET:?Set a long random JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      WORKSPACE_ROOT: /workspace
    volumes:
      - ./workspace:/workspace
      - backend_data:/app/data
    depends_on:
      db: {condition: service_healthy}
      ollama: {condition: service_started}
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8000
    depends_on: [backend]
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
volumes:
  ollama_data:
  postgres_data:
  backend_data:
